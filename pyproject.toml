[project]
name = "unidrivevla"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shintaro Sakoda" }]

dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "carla",
    "mmcv-full==1.7.2",
    "mmdet==2.28.2",
    "mmsegmentation==0.29.1",
    "deformable-aggregation-ext",
    "py-trees==0.8.3",
    "shapely>=2.0",
    "dictor",
    "ephem",
    "tabulate",
    "transforms3d==0.4.2",
    "xmlschema>=2.0",
    "simple-watchdog-timer",
    "networkx>=3.0",
    "psutil",
    "pexpect",
    "six",
    "numpy==1.23.5",
    "scipy",
    "pyquaternion==0.9.9",
    "opencv-python==4.8.1.78",
    "scikit-image",
    "scikit-learn==1.3.0",
    "Pillow",
    "pandas>=1.5,<2.2",
    "einops==0.8.1",
    "timm",
    "transformers==4.57.1",
    "tokenizers",
    "sentencepiece",
    "qwen-vl-utils",
    "accelerate",
    "peft",
    "addict",
    "yapf==0.33.0",
    "regex",
    "tqdm",
    "prettytable==3.7.0",
    "motmetrics==1.1.3",
    "nuscenes-devkit>=1.1.11",
    "pyyaml",
    "ipython",
    "matplotlib",
    "pycocotools",
    "safetensors",
    "deepspeed",
    "flash-attn",
    "wandb",
    "tensorboard==2.14.0",
    "setuptools<81",
    "wheel",
    "packaging",
]

[tool.uv]
package = false
python-preference = "only-managed"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
carla = { path = "../../CARLA_0.9.16/PythonAPI/carla/dist/carla-0.9.16-cp310-cp310-manylinux_2_31_x86_64.whl" }
mmcv-full = { path = "third_party/mmcv-1.7.2" }
deformable-aggregation-ext = { path = "Bench2Drive/projects/mmdet3d_plugin/ops", editable = true }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.1/flash_attn-2.8.1+cu12torch2.7cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }
